<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow - A modern task management application for organizing your daily tasks efficiently">
    <title>TaskFlow — Smart Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ═══════════════ SIDEBAR ═══════════════ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                </span>
                <span class="logo-text">TaskFlow</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" id="nav-all" data-filter="all">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </span>
                <span class="nav-label">All Tasks</span>
                <span class="nav-count" id="count-all">0</span>
            </button>
            <button class="nav-item" id="nav-pending" data-filter="pending">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </span>
                <span class="nav-label">Pending</span>
                <span class="nav-count" id="count-pending">0</span>
            </button>
            <button class="nav-item" id="nav-completed" data-filter="completed">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </span>
                <span class="nav-label">Completed</span>
                <span class="nav-count" id="count-completed">0</span>
            </button>
            <button class="nav-item" id="nav-high" data-filter="high">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </span>
                <span class="nav-label">High Priority</span>
                <span class="nav-count" id="count-high">0</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <button class="clear-all-btn" id="clear-completed-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                Clear Completed
            </button>
        </div>
    </aside>

    <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
    <main class="main-content">
        <!-- Header -->
        <header class="main-header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Navigation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div>
                    <h1 id="page-title">All Tasks</h1>
                    <p class="header-subtitle" id="page-subtitle">Manage all your tasks in one place</p>
                </div>
            </div>
            <div class="header-right">
                <div class="search-box" id="search-box">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off">
                </div>
                <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
                    <svg class="theme-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <span class="theme-label">Dark</span>
                </button>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar" id="stats-bar">
            <div class="stat-card stat-total">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card stat-active">
                <div class="stat-number" id="stat-active">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card stat-done">
                <div class="stat-number" id="stat-done">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card stat-progress">
                <div class="stat-number" id="stat-progress">0%</div>
                <div class="stat-label">Progress</div>
            </div>
        </section>

        <!-- Add Task Form -->
        <section class="add-task-section" id="add-task-section">
            <form class="add-task-form" id="add-task-form" novalidate>
                <div class="form-row">
                    <div class="form-group form-group-title">
                        <label for="task-title">Task Title <span class="required">*</span></label>
                        <input type="text" id="task-title" placeholder="What needs to be done?" maxlength="100" required>
                        <span class="error-msg" id="title-error"></span>
                    </div>
                    <div class="form-group form-group-priority">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group form-group-category">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="general">General</option>
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="study">Study</option>
                            <option value="health">Health</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group form-group-desc">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" placeholder="Add task details (optional)..." rows="2" maxlength="300"></textarea>
                    </div>
                    <div class="form-group form-group-date">
                        <label for="task-due-date">Due Date</label>
                        <input type="date" id="task-due-date">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="add-task-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Task
                    </button>
                    <button type="reset" class="btn btn-secondary" id="reset-form-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                        Reset
                    </button>
                </div>
            </form>
        </section>

        <!-- Sort Controls -->
        <section class="sort-controls" id="sort-controls">
            <span class="sort-label">Sort by:</span>
            <button class="sort-btn active" id="sort-date" data-sort="date">Date Added</button>
            <button class="sort-btn" id="sort-priority" data-sort="priority">Priority</button>
            <button class="sort-btn" id="sort-alpha" data-sort="alpha">A → Z</button>
            <button class="sort-btn" id="sort-due" data-sort="due">Due Date</button>
        </section>

        <!-- Task List -->
        <section class="task-list-section">
            <ul class="task-list" id="task-list">
                <!-- Tasks will be rendered here dynamically -->
            </ul>
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        <path d="M9 12h6"/>
                        <path d="M9 16h6"/>
                    </svg>
                </div>
                <h3>No tasks yet</h3>
                <p>Add a new task above to get started!</p>
            </div>
        </section>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Edit Task</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form class="modal-body" id="edit-form" novalidate>
                <div class="form-group">
                    <label for="edit-title">Task Title <span class="required">*</span></label>
                    <input type="text" id="edit-title" maxlength="100" required>
                    <span class="error-msg" id="edit-title-error"></span>
                </div>
                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" rows="3" maxlength="300"></textarea>
                </div>
                <div class="form-row-modal">
                    <div class="form-group">
                        <label for="edit-priority">Priority</label>
                        <select id="edit-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-category">Category</label>
                        <select id="edit-category">
                            <option value="general">General</option>
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="study">Study</option>
                            <option value="health">Health</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-due-date">Due Date</label>
                        <input type="date" id="edit-due-date">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary" id="save-edit-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Save Changes
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
